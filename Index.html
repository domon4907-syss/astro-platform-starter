<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineWave 2025 - Streaming & Trailers</title>
    <style>
        body {
            font-family: 'Helvetica', sans-serif;
            background-color: #050505;
            color: white;
            margin: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: linear-gradient(to bottom, black, transparent);
            position: fixed;
            width: 90%;
            z-index: 1000;
        }

        .logo { font-size: 28px; font-weight: bold; color: #e50914; letter-spacing: 2px; }

        nav a { color: #ccc; text-decoration: none; margin-left: 20px; transition: 0.3s; }
        nav a:hover { color: white; }

        /* Section Vidéo Principale (Hero) */
        .hero {
            position: relative;
            height: 80vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            padding: 0 5%;
        }

        .hero-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.6;
        }

        .hero-content { max-width: 600px; }
        .hero h1 { font-size: 60px; margin-bottom: 10px; }

        .btn {
            background-color: white;
            color: black;
            padding: 12px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            display: inline-block;
            margin-top: 20px;
        }

        /* Grille de Vidéos / Bandes-annonces */
        .container { padding: 50px 5%; }
        
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .video-card {
            background: #141414;
            border-radius: 10px;
            overflow: hidden;
        }

        /* Conteneur pour garder le ratio 16:9 des vidéos YouTube */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* Ratio 16:9 */
            height: 0;
        }

        .video-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }

        .video-info { padding: 15px; }
        .video-info h4 { margin: 0; color: #fff; }
        .video-info p { color: #888; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">CINEWAVE</div>
        <nav>
            <a href="#">Accueil</a>
            <a href="#">Tendances 2025</a>
            <a href="#">Ma Liste</a>
        </nav>
    </header>

    <!-- Vidéo de fond en haut de page -->
    <section class="hero">
        <video class="hero-video" autoplay muted loop playsinline>
            <source src="assets.mixkit.co" type="video/mp4">
        </video>
        <div class="hero-content">
            <h1>GLADIATOR II</h1>
            <p>L'épopée continue. Voyez la vengeance s'écrire dans le sang en 2025.</p>
            <a href="#trailers" class="btn">▶ Lecture</a>
        </div>
    </section>

    <div class="container" id="trailers">
        <h2>Bandes-annonces à la une</h2>
        <div class="video-grid">

            <!-- Vidéo 1 - Intégration YouTube -->
            <div class="video-card">
                <div class="video-container">
                    <iframe src="www.youtube.com" allowfullscreen></iframe>
                </div>
                <div class="video-info">
                    <h4>Gladiator II - Trailer</h4>
                    <p>Sortie : 2025 | Action</p>
                </div>
            </div>

            <!-- Vidéo 2 -->
            <div class="video-card">
                <div class="video-container">
                    <iframe src="www.youtube.com" allowfullscreen></iframe>
                </div>
                <div class="video-info">
                    <h4>Dune: Part Two</h4>
                    <p>Science-Fiction / Épique</p>
                </div>
            </div>

            <!-- Vidéo 3 -->
            <div class="video-card">
                <div class="video-container">
                    <iframe src="www.youtube.com" allowfullscreen></iframe>
                </div>
                <div class="video-info">
                    <h4>Mufasa: Le Roi Lion</h4>
                    <p>Animation / Famille</p>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
